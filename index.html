<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しるべ">
<meta name="theme-color" content="#EDE6D6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>しるべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F3EAD9;
    --paper-light:#FFFCF5;
    --paper-deep:#E8DBC0;
    --ink:#291F49;
    --ink-soft:#786fa0;
    --line: rgba(41,31,73,0.14);
    --santen:#7C4FE0;
    --fukugyo:#F0932B;
    --private:#16A085;
    --stamp:#F0433A;
    --grad-a:#7C4FE0;
    --grad-b:#F0433A;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Zen Kaku Gothic New', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(rgba(46,42,61,0.07) 1px, transparent 1px);
    background-size: 14px 14px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: linear-gradient(180deg, rgba(250,246,236,0.5), rgba(250,246,236,0.15));
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Header ---------- */
  .app-header{
    padding: calc(18px + var(--safe-top)) 18px 10px;
    position:relative;
  }
  .date-stamp{
    display:inline-block;
    font-family:var(--font-body);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:3px;
    padding:3px 8px;
    transform:rotate(-2deg);
    background:var(--paper-light);
  }
  .app-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:28px;
    letter-spacing:0.06em;
    margin:8px 0 12px;
    display:flex;
    align-items:baseline;
    gap:8px;
    background:linear-gradient(120deg, var(--grad-a), var(--stamp) 70%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    width:fit-content;
  }
  .app-title small{
    font-family:var(--font-body);
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .tape-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .tape{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:6px 12px 7px;
    color:#fff;
    border:none;
    cursor:pointer;
    position:relative;
    clip-path: polygon(2% 0%, 98% 0%, 100% 30%, 97% 60%, 100% 100%, 3% 100%, 0% 65%, 4% 32%);
    opacity:0.55;
    transform:rotate(-1deg);
    transition:opacity .15s, transform .15s;
  }
  .tape:nth-child(2n){ transform:rotate(1.2deg); }
  .tape.active{ opacity:1; transform:rotate(0deg) scale(1.04); }
  .tape.tape-santen{ background:var(--santen); }
  .tape.tape-fukugyo{ background:var(--fukugyo); }
  .tape.tape-private{ background:var(--private); }
  .tape.tape-all{ background:var(--ink-soft); }

  /* ---------- Main ---------- */
  main{
    flex:1;
    padding: 6px 16px 110px;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    margin: 20px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink);
  }
  .section-title .bar{ width:14px; height:2px; background:var(--ink); display:inline-block; }

  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow: 0 1px 0 rgba(46,42,61,0.05);
    padding:12px 14px;
    margin-bottom:10px;
  }

  /* Empty state */
  .empty-state{
    text-align:center;
    padding:26px 12px;
    color:var(--ink-soft);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:3px;
    background:rgba(255,255,255,0.25);
  }

  /* ---------- Task item ---------- */
  .task-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--paper-light);
    border:1px solid var(--line);
    border-left:4px solid var(--ink-soft);
    border-radius:2px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .task-item.cat-santen{ border-left-color:var(--santen); }
  .task-item.cat-fukugyo{ border-left-color:var(--fukugyo); }
  .task-item.cat-private{ border-left-color:var(--private); }
  .task-item.overdue{ background:#fbeee9; }

  .schedule-item{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--paper-light);
    border:1px solid var(--line);
    border-left:4px solid var(--ink-soft);
    border-radius:2px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .schedule-item.cat-santen{ border-left-color:var(--santen); }
  .schedule-item.cat-fukugyo{ border-left-color:var(--fukugyo); }
  .schedule-item.cat-private{ border-left-color:var(--private); }
  .schedule-time{ flex:0 0 66px; font-weight:700; font-size:11.5px; color:var(--ink); padding-top:2px; line-height:1.4; }
  .schedule-location{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .schedule-purpose{ font-size:12.5px; margin-top:6px; line-height:1.5; background:rgba(91,75,138,0.07); border-radius:2px; padding:6px 8px; white-space:pre-wrap; }
  .schedule-purpose-label{ display:block; font-size:10px; font-weight:700; color:var(--santen); margin-bottom:2px; }
  .sched-edit-form{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .sched-edit-form textarea{ min-height:56px; }

  .status-btn{
    width:30px;height:30px;flex:0 0 30px;
    border-radius:50%;
    border:2px solid var(--ink-soft);
    background:transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:12px;
    color:transparent;
    margin-top:2px;
    position:relative;
  }
  .status-btn.doing{
    border-style:dashed;
    border-color:var(--fukugyo);
    background: repeating-linear-gradient(45deg, rgba(201,138,46,0.15) 0 3px, transparent 3px 6px);
  }
  .status-btn.done{
    border-color:var(--stamp);
    color:var(--stamp);
    background:rgba(178,58,46,0.06);
  }
  .status-btn.done::after{
    content:'完';
  }
  .status-btn.stamp-in{
    animation: stampIn .35s cubic-bezier(.36,1.6,.5,1);
  }
  @keyframes stampIn{
    0%{ transform:scale(1.8) rotate(-18deg); opacity:0; }
    60%{ transform:scale(0.92) rotate(4deg); opacity:1; }
    100%{ transform:scale(1) rotate(-6deg); opacity:1; }
  }
  .status-btn.done{ transform:rotate(-6deg); }

  .task-main{ flex:1; min-width:0; }
  .task-title{ font-size:14.5px; font-weight:700; line-height:1.4; word-break:break-word; }
  .task-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .task-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; align-items:center; }
  .cat-tag{ font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:2px; color:#fff; letter-spacing:0.02em; }
  .cat-tag.cat-santen{ background:var(--santen); }
  .cat-tag.cat-fukugyo{ background:var(--fukugyo); }
  .cat-tag.cat-private{ background:var(--private); }
  .due-tag{ font-size:11px; color:var(--ink-soft); }
  .due-tag.overdue{ color:var(--stamp); font-weight:700; }
  .task-memo{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5; white-space:pre-wrap; }
  .task-actions{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .link-btn{
    background:none;border:none;padding:0;
    font-family:var(--font-body);
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .link-btn.danger{ color:var(--stamp); }

  /* ---------- Forms ---------- */
  .form-card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px;
    margin-bottom:14px;
  }
  label.field-label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin:10px 0 4px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  label.field-label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=time], textarea, select{
    width:100%;
    font-family:var(--font-body);
    font-size:14px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 10px;
    outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--ink-soft); }
  textarea{ resize:vertical; min-height:64px; line-height:1.5; }
  select{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236b6580'><path d='M5 7l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; }

  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.02em;
    padding:10px 16px;
    border-radius:8px;
    border:none;
    background:linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color:#fff;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(124,79,224,0.28);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:active{ transform:translateY(1px) scale(0.99); box-shadow:0 1px 4px rgba(124,79,224,0.28); }
  .btn.secondary{ background:none; color:var(--ink); box-shadow:none; border:1.5px solid var(--line); }
  .btn.small{ padding:6px 12px; font-size:12px; border-radius:6px; }
  .btn.block{ width:100%; margin-top:12px; }
  .btn:disabled{ opacity:0.5; cursor:default; transform:none; box-shadow:none; }
  .btn-row{ display:flex; gap:8px; }

  .add-toggle{
    width:100%;
    text-align:left;
    background:var(--paper-light);
    border:1px dashed var(--ink-soft);
    border-radius:3px;
    padding:11px 14px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    margin-bottom:12px;
  }

  /* ---------- Segmented control ---------- */
  .segmented{
    display:flex;
    background:var(--paper-deep);
    border-radius:3px;
    padding:3px;
    margin-bottom:12px;
    gap:2px;
  }
  .segmented button{
    flex:1;
    background:none;
    border:none;
    padding:7px 4px;
    font-family:var(--font-body);
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    border-radius:2px;
    cursor:pointer;
  }
  .segmented button.active{ background:var(--paper-light); color:var(--ink); box-shadow:0 1px 2px rgba(46,42,61,0.12); }

  /* ---------- Today tab ---------- */
  .greeting{ font-size:13px; color:var(--ink-soft); margin-bottom:2px; }
  .quick-add{ display:flex; gap:8px; margin-bottom:14px; }
  .quick-add input[type=text]{ flex:1; }

  .reflection-item{ border-bottom:1px solid var(--line); padding:10px 0; }
  .reflection-item:last-child{ border-bottom:none; }
  .reflection-date{ font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:3px; }
  .reflection-schedule-tag{ font-weight:400; color:var(--santen); margin-left:8px; }
  .reflection-text{ font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .reflection-field{ margin-top:8px; }
  .reflection-field:first-of-type{ margin-top:4px; }
  .reflection-field-label{ display:block; font-size:10.5px; font-weight:700; color:var(--santen); letter-spacing:0.02em; margin-bottom:2px; }

  /* ---------- Calendar ---------- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav button{ background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; font-size:15px; color:var(--ink); cursor:pointer; }
  .cal-nav .cal-label{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .gcal-banner{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }
  .ai-suggestion{ margin-top:10px; background:#f2eee0; border:1px dashed var(--ink-soft); border-radius:3px; padding:10px; font-size:13px; line-height:1.6; white-space:pre-wrap; }
  .ai-suggestion-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .gcal-banner.error{ color:var(--stamp); }
  .gcal-card{ margin-bottom:12px; }
  .gcal-event-item{ background:var(--paper-deep); border:1px dashed var(--ink-soft); border-radius:2px; padding:8px 11px; margin-bottom:8px; font-size:13px; line-height:1.5; }
  .gcal-event-time{ font-weight:700; color:var(--ink-soft); margin-right:6px; }
  .gcal-status{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .cal-dot.gcal{ background:transparent; border:1.2px solid var(--ink-soft); box-sizing:border-box; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px; }
  .cal-dow{ text-align:center; font-size:10.5px; color:var(--ink-soft); font-weight:700; padding-bottom:4px; }
  .cal-day{
    aspect-ratio:1/1;
    border-radius:3px;
    background:var(--paper-light);
    border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12.5px;
    cursor:pointer;
    position:relative;
    color:var(--ink);
  }
  .cal-day.blank{ background:transparent; cursor:default; }
  .cal-day.today{ border-color:var(--stamp); font-weight:700; }
  .cal-day.selected{ background:var(--ink); color:var(--paper-light); }
  .cal-dots{ display:flex; gap:2px; margin-top:2px; }
  .cal-dot{ width:4px; height:4px; border-radius:50%; }
  .cal-dot.cat-santen{ background:var(--santen); }
  .cal-dot.cat-fukugyo{ background:var(--fukugyo); }
  .cal-dot.cat-private{ background:var(--private); }
  .cal-dot.sched{ border-radius:1px; }
  .cal-day.selected .cal-dot{ filter:brightness(1.6); }

  /* ---------- Vision ---------- */
  .vision-intro{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.6; }
  .vision-card{ border-top:4px solid var(--santen); }
  .vision-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .vision-term-label{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--santen); }
  .vision-updated{ font-size:10.5px; color:var(--ink-soft); }

  /* ---------- Notes (books / people) ---------- */
  .note-item{ background:var(--paper-light); border:1px solid var(--line); border-radius:2px; padding:11px 13px; margin-bottom:8px; border-left:4px solid var(--ink-soft); }
  .note-item.cat-santen{ border-left-color:var(--santen); }
  .note-item.cat-fukugyo{ border-left-color:var(--fukugyo); }
  .note-item.cat-private{ border-left-color:var(--private); }
  .note-title{ font-size:14px; font-weight:700; }
  .note-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .note-memo{ font-size:13px; margin-top:6px; line-height:1.6; white-space:pre-wrap; display:none; }
  .note-memo.open{ display:block; }
  .note-date{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; }

  /* ---------- Tab bar ---------- */
  .tab-bar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:480px;
    background:var(--paper-light);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:var(--safe-bottom);
    z-index:20;
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    padding:9px 2px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:var(--font-body);
  }
  .tab-btn .ico{ font-size:17px; line-height:1; }
  .tab-btn .lbl{ font-size:9.5px; font-weight:700; letter-spacing:0.02em; }
  .tab-btn.active{ color:var(--stamp); }
  .tab-btn.active .ico{ transform:translateY(-1px) scale(1.15); transition:transform .15s; }
  .tab-btn.hidden{ display:none !important; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    left:50%;
    bottom:74px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--paper-light);
    font-size:12.5px;
    padding:9px 16px;
    border-radius:3px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
    max-width:80%;
    text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Voice FAB ---------- */
  .voice-fab{
    position:fixed;
    right:16px;
    bottom:76px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--stamp);
    color:#fff;
    border:none;
    font-size:22px;
    box-shadow:0 3px 8px rgba(46,42,61,0.28);
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .voice-fab.hidden{ display:none !important; }
  .voice-fab.listening{
    background:var(--santen);
    animation: voicePulse 1s ease-in-out infinite;
  }
  @keyframes voicePulse{
    0%,100%{ box-shadow:0 3px 8px rgba(46,42,61,0.28), 0 0 0 0 rgba(91,75,138,0.5); }
    50%{ box-shadow:0 3px 8px rgba(46,42,61,0.28), 0 0 0 10px rgba(91,75,138,0); }
  }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; z-index:100;
  }
  #loading .dot{
    width:16px;height:16px;border-radius:50%;background:var(--stamp);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:0.3; transform:scale(0.8);} 50%{ opacity:1; transform:scale(1);} }
  #loading .txt{ font-size:12px; color:var(--ink-soft); }

  .hidden{ display:none !important; }

  /* ---------- Launch screen category picker ---------- */
  .picker{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:24px 4px 40px;
  }
  .picker-greeting{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    text-align:center;
    margin-bottom:4px;
    color:var(--ink);
  }
  .picker-card{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:20px 16px;
    border:none;
    border-radius:4px;
    color:#fff;
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:0.04em;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(46,42,61,0.1);
  }
  .picker-card.cat-santen{ background:var(--santen); }
  .picker-card.cat-fukugyo{ background:var(--fukugyo); }
  .picker-card.cat-private{ background:var(--private); }
  .picker-card:active{ transform:translateY(1px); box-shadow:none; }
  .picker-skip{
    margin-top:4px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    align-self:center;
  }
</style>
</head>
<body>

<div id="loading"><div class="dot"></div><div class="txt">読み込み中…</div></div>

<div id="app" class="hidden">
  <header class="app-header">
    <span class="date-stamp" id="dateStamp"></span>
    <div class="app-title">しるべ <small>shirube</small></div>
    <div class="tape-row" id="tapeRow"></div>
  </header>

  <main id="main-content"></main>

  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn" data-tab="today"><span class="ico">☀</span><span class="lbl">今日</span></button>
    <button class="tab-btn" data-tab="tasks"><span class="ico">✓</span><span class="lbl">タスク</span></button>
    <button class="tab-btn" data-tab="calendar"><span class="ico">▦</span><span class="lbl">カレンダー</span></button>
    <button class="tab-btn" data-tab="vision"><span class="ico">✺</span><span class="lbl">Vision</span></button>
    <button class="tab-btn" data-tab="matome"><span class="ico">◈</span><span class="lbl">まとめ</span></button>
  </nav>

  <button id="voiceFab" class="voice-fab hidden" title="入力欄を選んでタップすると音声入力できます">🎤</button>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var CATS = {
    santen:  { label:'SANTEN',      short:'SANTEN' },
    fukugyo: { label:'副業',        short:'副業' },
    private: { label:'プライベート', short:'プラベ' }
  };
  var CAT_ORDER = ['santen','fukugyo','private'];
  var STATUS_ORDER = ['todo','doing','done'];
  var STATUS_LABEL = { todo:'未着手', doing:'進行中', done:'完了' };
  var DOW = ['日','月','火','水','木','金','土'];

  var state = {
    tasks: [],
    schedules: [],
    reflections: [],
    vision: {},
    books: [],
    people: [],
    dailyRoutines: [],
    routineCompletions: {},
    activeTab: 'today',
    matomeSubTab: 'reflections',
    categoryFilter: 'all',
    showLaunchScreen: true,
    statusFilter: 'all',
    calendarYear: null,
    calendarMonth: null,
    calendarSelected: null,
    showTaskForm: false,
    showBookForm: false,
    showPeopleForm: false,
    justCompletedId: null,
    justCompletedRoutineKey: null,
    deleteArmed: null,
    scheduleEditOpen: {},
    scheduleReflectOpen: {},
    reflectionEditOpen: {},
    openNotes: {},
    drafts: null,
    gcalClientId: null,
    gcalConnected: false,
    gcalConnecting: false,
    gcalAccessToken: null,
    gcalTokenExpiresAt: null,
    gcalEventsByMonth: {},
    gcalLoading: false,
    gcalError: null,
    gcalStatus: {},
    gcalLastFetchInfo: null,
    geminiApiKey: null,
    weeklySummaries: {},
    weeklySummaryLoading: {},
    openSummaries: {}
  };

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function esc(s){
    if(s===undefined||s===null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function catTag(cat){
    var c = CATS[cat] || {short:'—'};
    return '<span class="cat-tag cat-'+cat+'">'+esc(c.short)+'</span>';
  }
  function fmtDate(iso){
    if(!iso) return '';
    var p = iso.split('-');
    return p[1]+'/'+p[2];
  }
  function fmtDateTime(iso){
    var d = new Date(iso);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  /* ---------------- Storage (localStorage, this device only) ---------------- */
  var STORAGE_PREFIX = 'shirube:';
  function storageGet(key, fallback){
    try{
      var raw = window.localStorage.getItem(STORAGE_PREFIX+key);
      if(raw===null || raw===undefined) return fallback;
      return JSON.parse(raw);
    }catch(e){
      console.error('storage get failed', key, e);
      return fallback;
    }
  }
  function storageSet(key, value){
    try{
      window.localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value));
      return { ok:true };
    }catch(e){
      console.error('storage set failed', key, e);
      var detail = (e && e.message) ? e.message : String(e);
      return { ok:false, message:'保存に失敗しました: ' + detail };
    }
  }

  var VISION_TERMS = [
    ['short','短期','1〜3ヶ月ほどで目指したいこと'],
    ['mid','中期','半年〜1年ほどで目指したい姿'],
    ['long','長期','数年先に実現したいビジョン'],
    ['future','思い描く未来','どんな未来を思い描いているか、自由に'],
    ['issues','課題','今感じている課題や乗り越えたいこと']
  ];

  // すべての入力途中フォームの下書き。ここに載っているものは1文字入力するたびに
  // localStorageへ保存されるので、アプリが落ちても再度開けば復元される。
  function defaultDrafts(){
    return {
      qa: { title:'', date:'' },
      qs: { title:'', date:'', time:'', timeEnd:'', location:'' },
      task: { title:'', due:'', memo:'' },
      book: { title:'', author:'', memo:'' },
      person: { name:'', relation:'', memo:'' },
      reflection: { date:'', purpose:'', feeling:'', hansei:'', naisei:'' },
      vision: {}
    };
  }
  function saveDrafts(){ storageSet('drafts', state.drafts); }
  function trackDraftInput(el, section, field){
    if(!el) return;
    el.addEventListener('input', function(){
      state.drafts[section][field] = el.value;
      saveDrafts();
    });
  }
  function clearDraft(section){
    var fresh = defaultDrafts();
    state.drafts[section] = fresh[section];
    saveDrafts();
  }

  function loadAll(){
    var defaultVision = {};
    VISION_TERMS.forEach(function(t){ defaultVision[t[0]] = { text:'', updatedAt:null }; });

    state.tasks = storageGet('tasks', []);
    state.reflections = storageGet('reflections', []);
    state.vision = storageGet('vision', defaultVision);
    VISION_TERMS.forEach(function(t){ if(!state.vision[t[0]]) state.vision[t[0]] = {text:'', updatedAt:null}; });
    state.books = storageGet('book-notes', []);
    state.people = storageGet('people-notes', []);
    state.schedules = storageGet('schedules', []);
    state.dailyRoutines = storageGet('daily-routines', []);
    state.routineCompletions = storageGet('routine-completions', {});
    state.gcalClientId = storageGet('gcal-client-id', null);
    state.geminiApiKey = storageGet('gemini-api-key', null);
    state.weeklySummaries = storageGet('weekly-summaries', {});
    var loadedDrafts = storageGet('drafts', null);
    var fallbackDrafts = defaultDrafts();
    state.drafts = loadedDrafts ? Object.assign(fallbackDrafts, loadedDrafts, {
      qa: Object.assign(fallbackDrafts.qa, loadedDrafts.qa),
      qs: Object.assign(fallbackDrafts.qs, loadedDrafts.qs),
      task: Object.assign(fallbackDrafts.task, loadedDrafts.task),
      book: Object.assign(fallbackDrafts.book, loadedDrafts.book),
      person: Object.assign(fallbackDrafts.person, loadedDrafts.person),
      reflection: Object.assign(fallbackDrafts.reflection, loadedDrafts.reflection),
      vision: loadedDrafts.vision || {}
    }) : fallbackDrafts;

    // 初回のみ、毎日のタスクの初期セットを用意する
    if(state.dailyRoutines.length===0){
      state.dailyRoutines = [
        { id: uid(), title: '今日の振り返り', createdAt: Date.now() }
      ];
      storageSet('daily-routines', state.dailyRoutines);
    }
  }

  /* ---------------- Toast ---------------- */
  var toastTimer = null;
  function showToast(msg, duration){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, duration || 2400);
  }

  /* ================= VOICE INPUT (device speech recognition only, no AI) ================= */
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var voiceTarget = null;
  var voiceRecognizer = null;
  var voiceListening = false;

  function isVoiceField(el){
    if(!el) return false;
    if(el.tagName==='TEXTAREA') return true;
    if(el.tagName==='INPUT' && (el.type==='text')) return true;
    return false;
  }
  document.addEventListener('focusin', function(e){
    if(isVoiceField(e.target)) voiceTarget = e.target;
  }, true);

  function updateVoiceFab(){
    var fab = document.getElementById('voiceFab');
    if(!fab) return;
    fab.classList.toggle('listening', voiceListening);
    fab.textContent = voiceListening ? '●' : '🎤';
  }

  function onVoiceFabClick(){
    if(!voiceTarget || !document.contains(voiceTarget)){
      showToast('先に入力したい欄をタップしてから、もう一度お試しください');
      return;
    }
    if(voiceListening){
      voiceRecognizer.stop();
      return;
    }
    var target = voiceTarget;
    voiceRecognizer = new SpeechRec();
    voiceRecognizer.lang = 'ja-JP';
    voiceRecognizer.interimResults = false;
    voiceRecognizer.maxAlternatives = 1;
    voiceRecognizer.onstart = function(){ voiceListening = true; updateVoiceFab(); };
    voiceRecognizer.onerror = function(){ showToast('音声認識でエラーが発生しました'); };
    voiceRecognizer.onend = function(){ voiceListening = false; updateVoiceFab(); };
    voiceRecognizer.onresult = function(ev){
      var transcript = '';
      for(var i=0;i<ev.results.length;i++){ transcript += ev.results[i][0].transcript; }
      if(!document.contains(target)) return;
      target.value = (target.value ? target.value+' ' : '') + transcript;
      target.dispatchEvent(new Event('input', {bubbles:true}));
    };
    try{
      voiceRecognizer.start();
    }catch(e){
      console.error('speech recognition start failed', e);
      showToast('音声認識を開始できませんでした');
    }
  }

  /* ================= RENDER ================= */
  function render(){
    document.getElementById('dateStamp').textContent = todayLabel();
    var main = document.getElementById('main-content');
    var tabBar = document.getElementById('tabBar');

    if(state.showLaunchScreen){
      document.getElementById('tapeRow').innerHTML = '';
      tabBar.classList.add('hidden');
      main.innerHTML = renderLaunchScreen();
      attachHandlers();
      return;
    }

    tabBar.classList.remove('hidden');
    var showSantenTabs = (state.categoryFilter==='santen' || state.categoryFilter==='all');
    if(!showSantenTabs && SANTEN_ONLY_TABS.indexOf(state.activeTab)!==-1){ state.activeTab='today'; }
    renderTapeRow();
    renderTabBar();
    if(state.activeTab==='today') main.innerHTML = renderToday();
    else if(state.activeTab==='tasks') main.innerHTML = renderTasks();
    else if(state.activeTab==='calendar') main.innerHTML = renderCalendar();
    else if(state.activeTab==='vision') main.innerHTML = renderVision();
    else if(state.activeTab==='matome') main.innerHTML = renderMatome();
    attachHandlers();
  }

  function renderLaunchScreen(){
    var today = todayStr();
    var todaysTasks = state.tasks.filter(function(t){
      return t.status!=='done' ? (!t.dueDate || t.dueDate<=today) : t.dueDate===today;
    });
    var routineItems = state.dailyRoutines.map(function(r){
      var key = r.id+'|'+today;
      return {
        id: 'routine:'+r.id,
        title: r.title,
        category: 'santen',
        status: state.routineCompletions[key] || 'todo',
        dueDate: today,
        memo: '',
        createdAt: r.createdAt
      };
    });
    todaysTasks = routineItems.concat(todaysTasks).sort(function(a,b){
      var ad = a.dueDate||'9999', bd = b.dueDate||'9999';
      return ad<bd?-1:ad>bd?1:0;
    });

    var html = '<div class="section-title"><span class="bar"></span>今日のタスク</div>';
    if(todaysTasks.length===0){
      html += '<div class="empty-state">今日のタスクはありません。ゆっくりどうぞ。</div>';
    } else {
      todaysTasks.forEach(function(t){ html += renderTaskItem(t, today); });
    }

    var todaysSchedules = state.schedules.filter(function(s){ return s.date===today; })
      .slice().sort(function(a,b){ var at=a.time||'99:99', bt=b.time||'99:99'; return at<bt?-1:at>bt?1:0; });
    html += '<div class="section-title"><span class="bar"></span>今日の予定</div>';
    if(todaysSchedules.length===0){
      html += '<div class="empty-state">今日の予定はまだありません</div>';
    } else {
      todaysSchedules.forEach(function(s){ html += renderScheduleItem(s); });
    }

    html += '<div class="picker">'
      + '<div class="picker-greeting">どちらで進めますか？</div>';
    CAT_ORDER.forEach(function(c){
      html += '<button class="picker-card cat-'+c+'" data-action="pick-category" data-cat="'+c+'">'
        + '<span class="picker-card-label">'+esc(CATS[c].label)+'</span>'
        + '</button>';
    });
    html += '<button class="picker-skip" data-action="pick-category" data-cat="all">すべて見る</button>';
    html += '</div>';
    return html;
  }

  function todayLabel(){
    var d = new Date();
    return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';
  }

  function currentCategory(){
    return (state.categoryFilter && state.categoryFilter!=='all') ? state.categoryFilter : 'santen';
  }

  function renderTapeRow(){
    var html = '<button class="tape tape-all '+(state.categoryFilter==='all'?'active':'')+'" data-filter="all">すべて</button>';
    CAT_ORDER.forEach(function(c){
      html += '<button class="tape tape-'+c+' '+(state.categoryFilter===c?'active':'')+'" data-filter="'+c+'">'+esc(CATS[c].label)+'</button>';
    });
    document.getElementById('tapeRow').innerHTML = html;
  }

  var SANTEN_ONLY_TABS = ['vision'];

  function renderTabBar(){
    var showSantenTabs = (state.categoryFilter==='santen' || state.categoryFilter==='all');
    var btns = document.querySelectorAll('#tabBar .tab-btn');
    btns.forEach(function(b){
      var tab = b.getAttribute('data-tab');
      b.classList.toggle('active', tab===state.activeTab);
      var restricted = SANTEN_ONLY_TABS.indexOf(tab)!==-1;
      b.classList.toggle('hidden', restricted && !showSantenTabs);
    });
  }

  function filteredTasks(list){
    return list.filter(function(t){
      if(state.categoryFilter!=='all' && t.category!==state.categoryFilter) return false;
      return true;
    });
  }

  /* ---------- Today ---------- */
  function renderToday(){
    var today = todayStr();
    var relevant = filteredTasks(state.tasks).filter(function(t){
      return t.status!=='done' ? (!t.dueDate || t.dueDate<=today) : t.dueDate===today;
    });
    var routineItems = state.dailyRoutines.map(function(r){
      var key = r.id+'|'+today;
      return {
        id: 'routine:'+r.id,
        title: r.title,
        category: 'santen',
        status: state.routineCompletions[key] || 'todo',
        dueDate: today,
        memo: '',
        createdAt: r.createdAt
      };
    });
    var combined = routineItems.concat(relevant);
    combined.sort(function(a,b){
      var ad = a.dueDate||'9999', bd = b.dueDate||'9999';
      return ad<bd?-1:ad>bd?1:0;
    });

    var html = '<div class="greeting">今日も一日おつかれさまです</div>';

    html += '<div class="quick-add">'
      + '<input type="text" id="qaTitle" placeholder="やることを入力" value="'+esc(state.drafts.qa.title)+'" style="flex:1;">'
      + '</div>'
      + '<div class="quick-add">'
      + '<input type="date" id="qaDate" value="'+esc(state.drafts.qa.date||today)+'" style="flex:1;">'
      + '</div>'
      + '<button class="btn block" id="qaAdd" style="margin-top:-8px;margin-bottom:16px;">＋ タスクに追加</button>';

    html += '<div class="section-title"><span class="bar"></span>今日のタスク</div>';
    if(combined.length===0){
      html += '<div class="empty-state">今日のタスクはありません。ゆっくりどうぞ。</div>';
    } else {
      combined.forEach(function(t){ html += renderTaskItem(t, today); });
    }

    html += '<div class="section-title"><span class="bar"></span>予定を追加</div>';
    html += '<div class="form-card">'
      + '<label class="field-label">タイトル</label><input type="text" id="qsTitle" placeholder="例）ミーティング" value="'+esc(state.drafts.qs.title)+'">'
      + '<label class="field-label">日付</label><input type="date" id="qsDate" value="'+esc(state.drafts.qs.date||today)+'">'
      + '<div class="btn-row">'
      + '<div style="flex:1;"><label class="field-label">開始時刻</label><input type="time" id="qsTime" value="'+esc(state.drafts.qs.time)+'"></div>'
      + '<div style="flex:1;"><label class="field-label">終了時刻（任意）</label><input type="time" id="qsTimeEnd" value="'+esc(state.drafts.qs.timeEnd)+'"></div>'
      + '</div>'
      + '<label class="field-label">場所（任意）</label><input type="text" id="qsLocation" placeholder="例）〇〇会議室、オンライン" value="'+esc(state.drafts.qs.location)+'">'
      + '<button class="btn block" id="qsAdd">＋ 予定を追加</button>'
      + '</div>';

    var todaySchedules = filteredTasks(state.schedules).filter(function(s){ return s.date===today; })
      .slice().sort(function(a,b){ var at=a.time||'99:99', bt=b.time||'99:99'; return at<bt?-1:at>bt?1:0; });
    html += '<div class="section-title"><span class="bar"></span>今日の予定</div>';
    if(todaySchedules.length===0){
      html += '<div class="empty-state">今日の予定はまだありません</div>';
    } else {
      todaySchedules.forEach(function(s){ html += renderScheduleItem(s); });
    }

    html += '<div class="section-title"><span class="bar"></span>振り返り</div>';
    html += '<div class="card gcal-card">'
      + '<div class="vision-term-label" style="font-size:13px;">'+(state.geminiApiKey?'✓ AI週次まとめ機能が使えます':'AI週次まとめ機能（任意）')+'</div>'
      + '<div class="gcal-banner">Google AI StudioでAPIキー（無料枠）を発行し貼り付けると、「まとめ」タブで1週間分の振り返りをAIが短くまとめられます。登録される振り返りの内容自体は変わりません。</div>'
      + '<input type="text" id="geminiKeyInput" placeholder="AIzaSy..." value="'+esc(state.geminiApiKey||'')+'">'
      + '<div class="btn-row" style="margin-top:8px;">'
      + '<button class="btn small" data-action="gemini-save-key">保存する</button>'
      + (state.geminiApiKey ? '<button class="btn small secondary" data-action="gemini-change-key">解除する</button>' : '')
      + '</div></div>';
    html += '<div class="form-card">'
      + '<label class="field-label">日付</label><input type="date" id="reflectionDate" value="'+esc(state.drafts.reflection.date||today)+'">'
      + '<label class="field-label">目的</label><textarea id="reflectionPurpose" placeholder="何のために取り組んだか">'+esc(state.drafts.reflection.purpose)+'</textarea>'
      + '<label class="field-label">感じた・思ったこと</label><textarea id="reflectionFeeling" placeholder="感じたこと、心が動いたこと">'+esc(state.drafts.reflection.feeling)+'</textarea>'
      + '<label class="field-label">反省</label><textarea id="reflectionHansei" placeholder="うまくいかなかったこと、改善したいこと">'+esc(state.drafts.reflection.hansei)+'</textarea>'
      + '<label class="field-label">内省</label><textarea id="reflectionNaisei" placeholder="そこから見えてきた自分の傾向や気づき">'+esc(state.drafts.reflection.naisei)+'</textarea>'
      + '<button class="btn block" id="reflectionSave">振り返りを保存</button>'
      + '</div>';
    html += '<button class="link-btn" data-action="goto-reflections" style="margin-bottom:16px;display:inline-block;">過去の振り返りをすべて見る →</button>';
    return html;
  }

  function renderReflectionBody(r){
    var parts = [
      ['目的', r.purpose],
      ['感じた・思ったこと', r.feeling],
      ['反省', r.hansei],
      ['内省', r.naisei]
    ];
    var html = '';
    parts.forEach(function(p){
      if(p[1] && p[1].trim()){
        html += '<div class="reflection-field"><span class="reflection-field-label">'+esc(p[0])+'</span><div class="reflection-text">'+esc(p[1])+'</div></div>';
      }
    });
    return html;
  }

  var WEEK_START_DAY = 3; // 0=日, 1=月, 2=火, 3=水 … 週の区切りを水曜始まり（水〜火）にする
  function weekStartOf(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    if(isNaN(d.getTime())) d = new Date();
    var day = d.getDay();
    var diffFromWeekStart = (day - WEEK_START_DAY + 7) % 7;
    d.setDate(d.getDate()-diffFromWeekStart);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function weekRangeLabel(weekStart){
    var start = new Date(weekStart+'T00:00:00');
    var end = new Date(start); end.setDate(end.getDate()+6);
    return (start.getMonth()+1)+'/'+start.getDate()+' 〜 '+(end.getMonth()+1)+'/'+end.getDate();
  }

  function renderReflections(){
    var html = '<div class="vision-intro">保存した振り返りを1週間単位でまとめて表示します。入力は「今日」タブから行えます。</div>';

    if(state.reflections.length===0){
      html += '<div class="empty-state">まだ振り返りがありません</div>';
      return html;
    }

    var groups = {};
    state.reflections.forEach(function(r){
      var d = r.date || (new Date(r.createdAt)).toISOString().slice(0,10);
      var wk = weekStartOf(d);
      if(!groups[wk]) groups[wk] = [];
      groups[wk].push(r);
    });
    var weekKeys = Object.keys(groups).sort(function(a,b){ return a<b?1:-1; });

    weekKeys.forEach(function(wk){
      var items = groups[wk].slice().sort(function(a,b){ return b.createdAt-a.createdAt; });

      html += '<div class="card week-card">';
      html += '<div class="vision-head"><span class="vision-term-label">'+esc(weekRangeLabel(wk))+'</span><span class="vision-updated">'+items.length+'件</span></div>';

      if(state.geminiApiKey){
        var summary = state.weeklySummaries[wk];
        var loading = !!state.weeklySummaryLoading[wk];
        var stale = summary && summary.count < items.length;
        if(summary && !stale){
          var summaryOpen = !!state.openSummaries[wk];
          html += '<div class="ai-suggestion">';
          html += '<button class="link-btn" data-action="toggle-week-summary" data-week="'+wk+'">'+(summaryOpen?'▾ AIによる週次まとめ（閉じる）':'▸ AIによる週次まとめ（開く）')+'</button>';
          if(summaryOpen){
            [['目的',summary.purpose],['感じた・思ったこと',summary.feeling],['反省',summary.hansei],['内省',summary.naisei]].forEach(function(p){
              if(p[1] && p[1].trim()){
                html += '<div class="reflection-field"><span class="reflection-field-label">'+esc(p[0])+'</span><div>'+esc(p[1])+'</div></div>';
              }
            });
          }
          html += '</div>';
          html += '<button class="btn small secondary" style="margin-top:8px;" data-action="gen-week-summary" data-week="'+wk+'" '+(loading?'disabled':'')+'>'+(loading?'まとめ中…':'再生成する')+'</button>';
        } else {
          if(stale){ html += '<div class="gcal-banner">前回のまとめ以降に新しい振り返りが追加されています</div>'; }
          html += '<button class="btn small" data-action="gen-week-summary" data-week="'+wk+'" '+(loading?'disabled':'')+'>'+(loading?'まとめ中…':'AIでこの週をまとめる')+'</button>';

      items.forEach(function(r){
        var dateLabel = r.date ? esc(fmtDate(r.date)) : esc(fmtDateTime(r.createdAt));

              + '<label class="field-label">日付</label><input type="date" class="ref-edit-date" data-id="'+r.id+'" value="'+esc(r.date||'')+'">'
              + '<label class="field-label">目的</label><textarea class="ref-edit-purpose" data-id="'+r.id+'">'+esc(r.purpose||'')+'</textarea>'
              + '<label class="field-label">感じた・思ったこと</label><textarea class="ref-edit-feeling" data-id="'+r.id+'">'+esc(r.feeling||'')+'</textarea>'
              + '<label class="field-label">反省</label><textarea class="ref-edit-hansei" data-id="'+r.id+'">'+esc(r.hansei||'')+'</textarea>'
              + '<label class="field-label">内省</label><textarea class="ref-edit-naisei" data-id="'+r.id+'">'+esc(r.naisei||'')+'</textarea>'
              + '<div class="btn-row" style="margin-top:8px;">'
              + '<button class="btn small" data-action="reflection-edit-save" data-id="'+r.id+'">保存</button>'
              + '<button class="btn small secondary" data-action="reflection-edit-close" data-id="'+r.id+'">閉じる</button>'
              + '</div></div>';

            html += '<button class="link-btn danger" data-action="delete-reflection-confirm" data-id="'+r.id+'">本当に削除する</button>'

          } else {
            html += '<button class="link-btn danger" data-action="delete-reflection" data-id="'+r.id+'">削除</button>';
          }
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });

    return html;
  }

  function renderTaskItem(t, today){
    var overdue = t.status!=='done' && t.dueDate && t.dueDate < (today||todayStr());
    var cls = 'task-item cat-'+t.category+(overdue?' overdue':'');
    var statusCls = 'status-btn '+t.status+(state.justCompletedId===t.id?' stamp-in':'');
    var due = t.dueDate ? '<span class="due-tag'+(overdue?' overdue':'')+'">'+(overdue?'期限切れ ':'期限 ')+esc(fmtDate(t.dueDate))+'</span>' : '';
    var html = '<div class="'+cls+'" data-task-id="'+t.id+'">'
      + '<button class="'+statusCls+'" data-action="cycle-status" data-id="'+t.id+'" title="'+STATUS_LABEL[t.status]+'"></button>'
      + '<div class="task-main">'
      + '<div class="task-title'+(t.status==='done'?' done':'')+'">'+esc(t.title)+'</div>'
      + '<div class="task-meta">'+catTag(t.category)+due+'</div>';
    if(t.memo){ html += '<div class="task-memo">'+esc(t.memo)+'</div>'; }
    html += '<div class="task-actions">';
    if(state.deleteArmed===t.id){
      html += '<button class="link-btn danger" data-action="delete-task-confirm" data-id="'+t.id+'">本当に削除する</button>'
        + '<button class="link-btn" data-action="delete-task-cancel">キャンセル</button>';
    } else {
      html += '<button class="link-btn danger" data-action="delete-task" data-id="'+t.id+'">削除</button>';
    }
    html += '</div></div></div>';
    return html;
  }

    var reflecting = state.scheduleReflectOpen && state.scheduleReflectOpen[s.id];
    var html = '<div class="'+cls+'" data-schedule-id="'+s.id+'">'
      + '<div class="schedule-time">'+timeLabel+'</div>'
      + '<div class="task-main">'
      + '<div class="task-title">'+esc(s.title)+'</div>'
      + '<div class="task-meta">'+catTag(s.category)+'</div>';

    if(s.purpose){ html += '<div class="schedule-purpose"><span class="schedule-purpose-label">目的・狙い</span>'+esc(s.purpose)+'</div>'; }
    if(s.memo){ html += '<div class="task-memo">'+esc(s.memo)+'</div>'; }

    if(editing){
      html += '<div class="sched-edit-form">'
        + '<label class="field-label">場所</label><input type="text" class="sched-edit-location" data-id="'+s.id+'" value="'+esc(s.location||'')+'" placeholder="例）〇〇会議室、オンライン">'
        + '<label class="field-label">目的・狙い</label><textarea class="sched-edit-purpose" data-id="'+s.id+'" placeholder="この予定で何を達成したいか、なぜ必要か">'+esc(s.purpose||'')+'</textarea>'
        + '<div class="btn-row" style="margin-top:8px;">'
        + '<button class="btn small" data-action="schedule-edit-save" data-id="'+s.id+'">保存</button>'
        + '<button class="btn small secondary" data-action="schedule-edit-close" data-id="'+s.id+'">閉じる</button>'
        + '</div></div>';
    }

    if(reflecting){
      html += '<div class="sched-edit-form">'
        + '<label class="field-label">目的</label><textarea class="sched-reflect-purpose" data-id="'+s.id+'" placeholder="この予定は何のためだったか"></textarea>'
        + '<label class="field-label">感じた・思ったこと</label><textarea class="sched-reflect-feeling" data-id="'+s.id+'" placeholder="やってみて感じたこと、心が動いたこと"></textarea>'
        + '<label class="field-label">反省</label><textarea class="sched-reflect-hansei" data-id="'+s.id+'" placeholder="うまくいかなかったこと、改善したいこと"></textarea>'
        + '<label class="field-label">内省</label><textarea class="sched-reflect-naisei" data-id="'+s.id+'" placeholder="そこから見えてきた自分の傾向や気づき"></textarea>'
        + '<div class="btn-row" style="margin-top:8px;">'
        + '<button class="btn small" data-action="schedule-reflect-save" data-id="'+s.id+'">振り返りを保存</button>'
        + '<button class="btn small secondary" data-action="schedule-reflect-close" data-id="'+s.id+'">閉じる</button>'
        + '</div></div>';
    }

    html += '<div class="task-actions">'
      + '<button class="link-btn" data-action="schedule-edit-toggle" data-id="'+s.id+'">'+(editing?'編集を閉じる':'目的・場所を編集')+'</button>'
      + '<button class="link-btn" data-action="schedule-reflect-toggle" data-id="'+s.id+'">'+(reflecting?'振り返りを閉じる':'振り返る')+'</button>';
    if(state.gcalConnected){
      html += '<button class="link-btn" data-action="gcal-add" data-kind="schedule" data-id="'+s.id+'">Googleに追加</button>';
    }
    if(state.deleteArmed==='sched-'+s.id){
      html += '<button class="link-btn danger" data-action="delete-schedule-confirm" data-id="'+s.id+'">本当に削除する</button>'
        + '<button class="link-btn" data-action="delete-task-cancel">キャンセル</button>';

      html += '<button class="link-btn danger" data-action="delete-schedule" data-id="'+s.id+'">削除</button>';
    }
    html += '</div>';
    if(state.gcalStatus['schedule:'+s.id]){ html += '<div class="gcal-status">'+esc(state.gcalStatus['schedule:'+s.id])+'</div>'; }
    html += '</div></div>';
    return html;

  /* ---------- Task list ---------- */
  function renderTasks(){
    var list = filteredTasks(state.tasks).filter(function(t){
      return state.statusFilter==='all' || t.status===state.statusFilter;
    });
    list.sort(function(a,b){
      var ad=a.dueDate||'9999', bd=b.dueDate||'9999';
      if(ad!==bd) return ad<bd?-1:1;
      return b.createdAt - a.createdAt;
    });

    var html = '<div class="segmented" id="statusSeg">';
    [['all','すべて'],['todo','未着手'],['doing','進行中'],['done','完了']].forEach(function(p){
      html += '<button data-status="'+p[0]+'" class="'+(state.statusFilter===p[0]?'active':'')+'">'+p[1]+'</button>';
    });
    html += '</div>';

    if(!state.showTaskForm){
      html += '<button class="add-toggle" data-action="show-task-form">＋ 新しいタスクを追加</button>';
    } else {
      html += '<div class="form-card">'
        + '<label class="field-label">タスク名</label><input type="text" id="newTaskTitle" placeholder="例）来月の資料を準備する" value="'+esc(state.drafts.task.title)+'">'
        + '<label class="field-label">期限（任意）</label><input type="date" id="newTaskDue" value="'+esc(state.drafts.task.due)+'">'
        + '<label class="field-label">メモ（任意）</label><textarea id="newTaskMemo" placeholder="補足があれば">'+esc(state.drafts.task.memo)+'</textarea>'
        + '<div class="btn-row" style="margin-top:12px;">'
        + '<button class="btn" id="saveTaskBtn">追加する</button>'
        + '<button class="btn secondary" id="cancelTaskBtn">キャンセル</button>'
        + '</div></div>';
    }

    if(list.length===0){
      html += '<div class="empty-state">該当するタスクがありません</div>';
    } else {
      var today = todayStr();
      list.forEach(function(t){ html += renderTaskItem(t, today); });
    }
    return html;

  /* ---------- Calendar ---------- */
  function monthKey(y,m){ return y+'-'+pad(m+1); }

    var html = '<div class="card gcal-card">';
    html += '<div class="vision-term-label" style="font-size:13px;">'+(state.gcalConnected?'✓ Googleカレンダーに接続済み':'Googleカレンダー連携')+'</div>'

      + '<div class="btn-row" style="margin-top:8px;">'
      + '<button class="btn small" data-action="gcal-save-client-id">保存する</button>'
      + (state.gcalClientId ? '<button class="btn small secondary" data-action="gcal-change-client-id">解除する</button>' : '')
      + '</div>';
    if(state.gcalClientId && !state.gcalConnected){
      html += '<div class="btn-row" style="margin-top:8px;">'

        + '</div>';

      html += '<div class="btn-row" style="margin-top:8px;">'
        + '<button class="btn small secondary" data-action="gcal-refresh" '+(state.gcalLoading?'disabled':'')+'>'+(state.gcalLoading?'更新中…':'⟳ 更新')+'</button>'
        + '<button class="btn small secondary" data-action="gcal-disconnect">連携解除</button>'
        + '</div>';
      if(state.gcalLastFetchInfo){
        if(state.gcalLastFetchInfo.error){
          html += '<div class="gcal-status">診断: 取得失敗（'+esc(state.gcalLastFetchInfo.error)+'）</div>';
        } else {
          html += '<div class="gcal-status">診断: '+state.gcalLastFetchInfo.range+' の範囲で '+state.gcalLastFetchInfo.count+' 件取得</div>';
        }
      }
    }
    if(state.gcalError){ html += '<div class="gcal-banner error" style="margin-top:8px;">'+esc(state.gcalError)+'</div>'; }
    html += '</div>';
    return html;

  function renderCalendar(){
    var y = state.calendarYear, m = state.calendarMonth;
    var first = new Date(y,m,1);
    var firstDow = first.getDay();
    var days = new Date(y,m+1,0).getDate();
    var today = todayStr();

    var tasksByDate = {};
    filteredTasks(state.tasks).forEach(function(t){
      if(!t.dueDate) return;
      if(!tasksByDate[t.dueDate]) tasksByDate[t.dueDate]=[];
      tasksByDate[t.dueDate].push(t);
    });
    var schedulesByDate = {};
    filteredTasks(state.schedules).forEach(function(s){
      if(!s.date) return;
      if(!schedulesByDate[s.date]) schedulesByDate[s.date]=[];
      schedulesByDate[s.date].push(s);
    });
    var gcalMap = state.gcalEventsByMonth[monthKey(y,m)] || {};

    var html = '<div class="cal-nav">'
      + '<button data-action="cal-prev">◀</button>'
      + '<span class="cal-label">'+y+'年 '+(m+1)+'月</span>'
      + '<button data-action="cal-next">▶</button>'
      + '</div>';

    html += renderGcalControls();

    html += '<div class="gcal-banner">●タスクの期限　■このアプリの予定'+(state.gcalConnected?'　○Googleカレンダーの予定':'')+'</div>';

    html += '<div class="cal-grid">';
    DOW.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<firstDow;i++){ html += '<div class="cal-day blank"></div>'; }
    for(var d=1; d<=days; d++){
      var dateStr = y+'-'+pad(m+1)+'-'+pad(d);
      var isToday = dateStr===today;
      var isSel = dateStr===state.calendarSelected;
      var cls = 'cal-day'+(isToday?' today':'')+(isSel?' selected':'');
      var dots = '';
      var dayTasks = tasksByDate[dateStr]||[];
      var seenCats = {};
      dayTasks.forEach(function(t){
        if(!seenCats[t.category]){ seenCats[t.category]=true; dots += '<span class="cal-dot cat-'+t.category+'"></span>'; }
      });
      var daySchedules = schedulesByDate[dateStr]||[];
      var seenSchedCats = {};
      daySchedules.forEach(function(s){
        if(!seenSchedCats[s.category]){ seenSchedCats[s.category]=true; dots += '<span class="cal-dot sched cat-'+s.category+'"></span>'; }
      });
      if((gcalMap[dateStr]||[]).length){ dots += '<span class="cal-dot gcal"></span>'; }
      html += '<div class="'+cls+'" data-action="cal-select" data-date="'+dateStr+'">'+d
        + (dots?'<div class="cal-dots">'+dots+'</div>':'')
        + '</div>';
    }
    html += '</div>';

    var selTasks = (tasksByDate[state.calendarSelected]||[]).slice().sort(function(a,b){ return a.createdAt-b.createdAt; });
    var selSchedules = (schedulesByDate[state.calendarSelected]||[]).slice().sort(function(a,b){
      var at=a.time||'99:99', bt=b.time||'99:99'; return at<bt?-1:at>bt?1:0;
    });
    var selGcal = (gcalMap[state.calendarSelected]||[]).slice().sort(function(a,b){
      var at=a.time||'99:99', bt=b.time||'99:99'; return at<bt?-1:at>bt?1:0;
    });

    html += '<div class="section-title"><span class="bar"></span>'+esc(fmtDate(state.calendarSelected))+'の予定</div>';
    if(selTasks.length===0 && selSchedules.length===0 && selGcal.length===0){
      html += '<div class="empty-state">この日の予定はありません</div>';
    } else {
      selGcal.forEach(function(ev){
        html += '<div class="gcal-event-item"><span class="gcal-event-time">'+(ev.allDay?'終日':esc(ev.time||''))+'</span> '+esc(ev.title)+'</div>';
      });
      selSchedules.forEach(function(s){ html += renderScheduleItem(s); });
      selTasks.forEach(function(t){
        var statusKey = 'task:'+t.id;
        html += '<div class="card">'
          + '<div class="task-title'+(t.status==='done'?' done':'')+'">'+esc(t.title)+'</div>'
          + '<div class="task-meta">'+catTag(t.category)+'</div>'
          + (state.gcalConnected ? '<button class="link-btn" data-action="gcal-add" data-kind="task" data-id="'+t.id+'">Googleに追加</button>' : '')
          + (state.gcalStatus[statusKey] ? '<div class="gcal-status">'+esc(state.gcalStatus[statusKey])+'</div>' : '')
          + '</div>';
      });
    }
    return html;
  }

  function cycleStatus(id){
    var t = state.tasks.find(function(x){ return x.id===id; });
    if(!t) return;
    var prevStatus = t.status, prevCompletedAt = t.completedAt;
    var idx = STATUS_ORDER.indexOf(t.status);
    t.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
    t.completedAt = t.status==='done' ? Date.now() : null;
    state.justCompletedId = t.status==='done' ? t.id : null;
    var result = storageSet('tasks', state.tasks);
    if(!result.ok){
      t.status = prevStatus;
      t.completedAt = prevCompletedAt;
      state.justCompletedId = null;
      showToast(result.message, 6000);
    }
    render();
    if(state.justCompletedId){
      setTimeout(function(){ state.justCompletedId=null; }, 400);
    }
  }

  function cycleRoutineStatus(routineId){
    var today = todayStr();
    var key = routineId+'|'+today;
    var prevStatus = state.routineCompletions[key] || 'todo';
    var idx = STATUS_ORDER.indexOf(prevStatus);
    var newStatus = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
    state.routineCompletions[key] = newStatus;
    state.justCompletedRoutineKey = newStatus==='done' ? key : null;
    var result = storageSet('routine-completions', state.routineCompletions);
    if(!result.ok){
      state.routineCompletions[key] = prevStatus;
      state.justCompletedRoutineKey = null;
      showToast(result.message, 6000);
    }
    render();
    if(state.justCompletedRoutineKey){
      setTimeout(function(){ state.justCompletedRoutineKey=null; }, 400);
    }
  }

  /* ---------- Google Calendar ---------- */
  var GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar';
  var gcalTokenClient = null;

  function ensureGoogleTokenClient(){
    if(!state.gcalClientId) return null;
    if(!window.google || !google.accounts || !google.accounts.oauth2) return null;
    if(gcalTokenClient) return gcalTokenClient;
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.gcalClientId,
      scope: GCAL_SCOPE,
      callback: function(resp){
        state.gcalConnecting = false;
        if(resp && resp.access_token){
          state.gcalAccessToken = resp.access_token;
          state.gcalTokenExpiresAt = Date.now() + (resp.expires_in||3600)*1000;
          state.gcalConnected = true;
          state.gcalError = null;
          render();
          loadGCalMonth(state.calendarYear, state.calendarMonth, true);
        } else {
          state.gcalError = 'Googleへのログインに失敗しました';
          render();
        }
      }
    });
    return gcalTokenClient;
  }

  function gcalTokenValid(){
    return !!(state.gcalConnected && state.gcalAccessToken && state.gcalTokenExpiresAt && Date.now() < state.gcalTokenExpiresAt - 30000);
  }

  function saveGcalClientId(id){
    state.gcalClientId = id;
    gcalTokenClient = null;
    storageSet('gcal-client-id', id);
    render();
  }

  function resetGcalClientId(){
    state.gcalClientId = null;
    state.gcalConnected = false;
    state.gcalAccessToken = null;
    state.gcalTokenExpiresAt = null;
    state.gcalEventsByMonth = {};
    gcalTokenClient = null;
    gcalCalendarIdsCache = null;
    storageSet('gcal-client-id', null);
    render();
  }

  function connectGoogleCalendar(){
    var tc = ensureGoogleTokenClient();
    if(!tc){ showToast('Google連携の準備ができていません。少し待ってからもう一度お試しください'); return; }
    state.gcalConnecting = true;
    state.gcalError = null;
    render();
    tc.requestAccessToken({ prompt: state.gcalConnected ? '' : 'consent' });
  }

  function disconnectGoogleCalendar(){
    if(state.gcalAccessToken && window.google && google.accounts && google.accounts.oauth2){
      google.accounts.oauth2.revoke(state.gcalAccessToken, function(){});
    }
    state.gcalConnected = false;
    state.gcalAccessToken = null;
    state.gcalTokenExpiresAt = null;
    state.gcalEventsByMonth = {};
    gcalCalendarIdsCache = null;
    showToast('Google連携を解除しました');
    render();
  }

  var gcalCalendarIdsCache = null;

  function fetchGcalCalendarIds(){
    if(gcalCalendarIdsCache) return Promise.resolve(gcalCalendarIdsCache);
    return fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader', {
      headers: { 'Authorization': 'Bearer ' + state.gcalAccessToken }
    }).then(function(res){
      if(!res.ok){ var err = new Error('HTTP '+res.status); err.status = res.status; throw err; }
      return res.json();
    }).then(function(data){
      var items = data.items || [];
      var ids = items.filter(function(c){ return c.selected!==false; }).map(function(c){ return c.id; });
      // The user's own calendar is usually already listed here (under their
      // email address, flagged primary:true) — only fall back to the literal
      // "primary" alias if it's genuinely missing, otherwise we'd fetch the
      // same calendar twice under two different ids and duplicate events.
      var hasPrimary = items.some(function(c){ return c.primary; }) || ids.indexOf('primary')!==-1;
      if(!hasPrimary) ids.unshift('primary');
      gcalCalendarIdsCache = ids;
      return ids;
    });
  }

  function loadGCalMonth(year, month, force){
    if(!gcalTokenValid()) return;
    var key = monthKey(year, month);
    if(state.gcalEventsByMonth[key] && !force) return;
    state.gcalLoading = true;
    state.gcalError = null;
    render();
    var startDate = new Date(year, month, 1);
    var endDate = new Date(year, month+1, 1);
    var timeMin = encodeURIComponent(startDate.toISOString());
    var timeMax = encodeURIComponent(endDate.toISOString());

    fetchGcalCalendarIds().then(function(calendarIds){
      return Promise.all(calendarIds.map(function(calId){
        var url = 'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calId)+'/events'
          + '?timeMin='+timeMin+'&timeMax='+timeMax+'&singleEvents=true&orderBy=startTime&maxResults=250';
        return fetch(url, { headers: { 'Authorization': 'Bearer ' + state.gcalAccessToken } })
          .then(function(res){ return res.ok ? res.json() : { items: [] }; })
          .catch(function(){ return { items: [] }; });
      }));
    }).then(function(results){
      var map = {};
      var total = 0;
      var seenIds = {};
      results.forEach(function(data){
        (data.items||[]).forEach(function(ev){
          if(ev.status==='cancelled') return;
          // The same event can be returned by more than one calendar (e.g.
          // an event you're invited to appears on both your own calendar
          // and the organizer's), so skip anything we've already added.
          if(seenIds[ev.id]) return;
          seenIds[ev.id] = true;
          var startObj = ev.start||{};
          var allDay = !!startObj.date;
          var dateStr = null, time = null;
          if(allDay){
            dateStr = startObj.date;
          } else if(startObj.dateTime){
            // Parse via Date so both "+09:00"-offset and UTC "Z" timestamps
            // resolve to the correct local calendar day, instead of naively
            // slicing the first 10 characters of the raw string.
            var dt = new Date(startObj.dateTime);
            dateStr = dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
            time = pad(dt.getHours())+':'+pad(dt.getMinutes());
          }
          if(!dateStr) return;
          if(!map[dateStr]) map[dateStr]=[];
          map[dateStr].push({ id: ev.id, title: ev.summary || '(無題の予定)', allDay: allDay, time: time });
          total++;
        });
      });
      state.gcalEventsByMonth[key] = map;
      state.gcalLoading = false;
      state.gcalLastFetchInfo = { count: total, range: startDate.toLocaleDateString('ja-JP')+' 〜 '+endDate.toLocaleDateString('ja-JP')+'（'+results.length+'カレンダー分）' };
      render();
    }).catch(function(e){
      console.error('gcal load failed', e);
      state.gcalLoading = false;
      state.gcalLastFetchInfo = { error: (e && e.status) ? ('HTTPエラー '+e.status) : ('通信エラー: '+(e&&e.message||e)) };
      if(e && e.status===401){
        state.gcalConnected = false;
        state.gcalAccessToken = null;
        state.gcalError = 'Googleとの接続が切れました。再度ログインしてください';
      } else if(e && e.status===403){
        state.gcalError = 'アクセス権限が不足しています（スコープの設定をご確認ください）';
      } else {
        state.gcalError = 'Googleカレンダーの取得に失敗しました';
      }
      render();
    });
  }

  function pushToGoogleCalendar(kind, itemId){
    if(!gcalTokenValid()){ showToast('先にGoogleにログインしてください'); return; }
    var item, body;
    if(kind==='schedule'){
      item = state.schedules.find(function(x){ return x.id===itemId; });
      if(!item) return;
      if(item.time){
        var startDt = new Date(item.date+'T'+item.time+':00');
        var endDt = item.endTime ? new Date(item.date+'T'+item.endTime+':00') : new Date(startDt.getTime()+60*60*1000);
        body = { summary: item.title, start: { dateTime: startDt.toISOString() }, end: { dateTime: endDt.toISOString() } };
      } else {
        var nextDay = new Date(item.date+'T00:00:00'); nextDay.setDate(nextDay.getDate()+1);
        body = { summary: item.title, start: { date: item.date }, end: { date: nextDay.toISOString().slice(0,10) } };
      }
      if(item.location) body.location = item.location;
      if(item.purpose) body.description = item.purpose;
    } else {
      item = state.tasks.find(function(x){ return x.id===itemId; });
      if(!item || !item.dueDate){ showToast('期限日が設定されていません'); return; }
      var nextDay2 = new Date(item.dueDate+'T00:00:00'); nextDay2.setDate(nextDay2.getDate()+1);
      body = { summary: item.title, start: { date: item.dueDate }, end: { date: nextDay2.toISOString().slice(0,10) } };
    }
    var statusKey = kind+':'+itemId;
    state.gcalStatus[statusKey] = '追加中…';
    render();
    fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.gcalAccessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok){ var err = new Error('HTTP '+res.status); err.status = res.status; throw err; }
      return res.json();
    }).then(function(){
      state.gcalStatus[statusKey] = '✓ Googleカレンダーに追加しました';
      render();
      loadGCalMonth(state.calendarYear, state.calendarMonth, true);
    }).catch(function(e){
      console.error('gcal push failed', e);
      state.gcalStatus[statusKey] = '追加できませんでした。時間をおいて再度お試しください';
      render();
    });
  }

  function saveVision(term){
    if(!state.vision[term]) state.vision[term]={text:'',updatedAt:null};
    var prevText = state.vision[term].text;
    var prevUpdatedAt = state.vision[term].updatedAt;
    if(state.drafts.vision[term]!==undefined) state.vision[term].text = state.drafts.vision[term];
    state.vision[term].updatedAt = Date.now();
    var result = storageSet('vision', state.vision);
    if(result.ok){
      delete state.drafts.vision[term];
      saveDrafts();
      showToast('Visionを保存しました');
    } else {
      state.vision[term].text = prevText;
      state.vision[term].updatedAt = prevUpdatedAt;
      showToast(result.message, 6000);
    }
    render();
  }

  /* ---------- AI（Gemini 無料枠）で振り返りを整える ---------- */
  function saveGeminiApiKey(key){
    state.geminiApiKey = key;
    storageSet('gemini-api-key', key);
    render();
  }
  function resetGeminiApiKey(){
    state.geminiApiKey = null;
    storageSet('gemini-api-key', null);
    render();
  }

  function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

  function callGeminiOnce(promptText){
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + encodeURIComponent(state.geminiApiKey);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(body){
          var detail = body && body.error && body.error.message;
          var err = new Error(detail ? ('HTTP '+res.status+': '+detail) : ('HTTP '+res.status));
          err.status = res.status;
          throw err;
        });
      }
      return res.json();
    }).then(function(data){
      var c = data && data.candidates && data.candidates[0];
      var text = c && c.content && c.content.parts && c.content.parts[0] && c.content.parts[0].text;
      if(!text){
        var blockReason = data && data.promptFeedback && data.promptFeedback.blockReason;
        var finishReason = c && c.finishReason;
        var err = new Error(blockReason ? ('ブロックされました: '+blockReason) : (finishReason ? ('応答なし: '+finishReason) : '応答にテキストが含まれていません'));
        throw err;
      }
      return text;
    });
  }

  // モデルが一時的に混み合っている（503）・レート制限（429）の場合は、
  // 少し間を空けて自動で再試行する。
  function callGemini(promptText, attempt){
    attempt = attempt || 1;
    return callGeminiOnce(promptText).catch(function(e){
      var retryable = e && (e.status===503 || e.status===429);
      if(retryable && attempt < 3){
        return sleep(attempt * 1500).then(function(){ return callGemini(promptText, attempt+1); });
      }
      throw e;
    });
  }

  // 振り返りの4項目を、意味を変えずに分かりやすく短くAIで整える。
  // 失敗した場合は null を返し、呼び出し側は元の文章のまま保存する。
  function generateWeeklySummary(weekKey){
    var items = state.reflections.filter(function(r){
      var d = r.date || (new Date(r.createdAt)).toISOString().slice(0,10);
      return weekStartOf(d)===weekKey;
    });
    if(items.length===0) return;
    state.weeklySummaryLoading[weekKey] = true;
    render();
    var sorted = items.slice().sort(function(a,b){ return a.createdAt-b.createdAt; });
    function fieldBody(field){
      return sorted.filter(function(r){ return r[field]; }).map(function(r){
        return (r.date?'日付: '+r.date+'\n':'') + r[field];
      }).join('\n\n---\n\n');
    }
    var purposeBody = fieldBody('purpose');
    var feelingBody = fieldBody('feeling');
    var hanseiBody = fieldBody('hansei');
    var naiseiBody = fieldBody('naisei');
    var prompt = '以下は1週間分の振り返りメモを「目的」「感じた・思ったこと」「反省」「内省」の4項目別に並べたものです。'
      + 'それぞれの項目ごとに、全体を通じて見えてくる内容を簡潔で読みやすい文章にまとめてください。箇条書きではなく、自然な文章でお願いします。'
      + 'その項目の記録が1件もない場合は空文字列にしてください。'
      + '出力は次のJSON形式のみとし、前置き・説明・コードブロック記法（```など）は一切使わないでください。\n'
      + '{"purpose":"...","feeling":"...","hansei":"...","naisei":"..."}\n\n'
      + '【目的】\n' + (purposeBody||'(記録なし)') + '\n\n'
      + '【感じた・思ったこと】\n' + (feelingBody||'(記録なし)') + '\n\n'
      + '【反省】\n' + (hanseiBody||'(記録なし)') + '\n\n'
      + '【内省】\n' + (naiseiBody||'(記録なし)');
    callGemini(prompt).then(function(text){
      var cleaned = (text||'').replace(/```json/gi,'').replace(/```/g,'').trim();
      var parsed = JSON.parse(cleaned);
      state.weeklySummaryLoading[weekKey] = false;
      if(parsed && typeof parsed === 'object'){
        state.weeklySummaries[weekKey] = {
          purpose: typeof parsed.purpose==='string' ? parsed.purpose : '',
          feeling: typeof parsed.feeling==='string' ? parsed.feeling : '',
          hansei: typeof parsed.hansei==='string' ? parsed.hansei : '',
          naisei: typeof parsed.naisei==='string' ? parsed.naisei : '',
          generatedAt: Date.now(),
          count: items.length
        };
        storageSet('weekly-summaries', state.weeklySummaries);
      } else {
        showToast('AIからの応答を取得できませんでした');
      }
      render();
    }).catch(function(e){
      console.error('weekly summary failed', e);
      state.weeklySummaryLoading[weekKey] = false;
      showToast('週次まとめの生成に失敗しました: ' + ((e&&e.message)||e), 8000);
      render();
    });
  }

  /* ================= INIT ================= */
  function init(){
    var now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();
    state.calendarSelected = todayStr();
    try{
      loadAll();
    }catch(e){
      console.error('init load failed', e);
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    var fab = document.getElementById('voiceFab');
    if(fab && SpeechRec){
      fab.classList.remove('hidden');
      fab.addEventListener('click', onVoiceFabClick);
    }
    render();

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('service-worker.js').catch(function(e){
        console.error('service worker registration failed', e);
      });
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
